version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: flexdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flexdesk
      POSTGRES_PASSWORD: flexdesk
      POSTGRES_DB: flexdesk
    ports:
      - "5432:5432"
    volumes:
      - flexdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flexdesk_pgdata:
